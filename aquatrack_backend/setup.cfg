[flake8]
max-line-length = 100
extend-ignore = E501
per-file-ignores =
    # SQLAlchemy filter() uses == True/False intentionally (not Python bool comparisons)
    app/crud/*.py: E712

[isort]
# Without this, isort's default grid style and black's magic trailing comma
# rewrite the same import blocks back and forth forever — CLAUDE.md tells you to
# run both, so they have to agree.
profile = black
line_length = 88
